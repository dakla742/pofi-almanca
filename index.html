<script>
const $=id=>document.getElementById(id);
const L=(t,a,b,v0,v1)=>t<=a?v0:t>=b?v1:v0+(v1-v0)*(t-a)/(b-a);
const LE=(t,a,b,v0,v1)=>{const u=L(t,a,b,0,1);return v0+(v1-v0)*u*u*(3-2*u)};
const DUR=30,INTRO=3.2;let R=0;
// camera keys: [time, zoom, cx, cy]; same time twice = hard cut
const K=[[0,1,200,330],[5,1.12,205,340],[5,1.12,205,340],[9,1.3,235,380],[9,2.7,215,350],[12.6,2.9,215,355],[12.6,1.5,150,420],[14,1.5,140,470],[14,1.4,130,500],[17.8,1.3,150,490],[17.8,1.2,150,470],[22,1.25,150,480],[22,1.9,140,525],[25,1.9,140,525],[25,1.2,150,490],[30,1.05,160,480]];
const caps=[[1,"Gece yarısı. Mutfak sessiz."],[5,"Pofi aç. Hem de çok aç."],[9.2,"Ve elma... tam karşısında."],[13.6,"Pofi'nin bununla hiçbir ilgisi yok."],[17.8,"Peki elmaya Almancada ne denir?"],[20.8,"der Apfel"],[23.2,"Bir daha dinle:"],[25,"der Apfel"],[27.2,"Yarın görüşürüz."]];
const lines=[[1,"Gece yarısı. Mutfak sessiz.","tr-TR",3.2],[5,"Pofi aç. Hem de çok aç.","tr-TR",3],[9.2,"Ve elma... tam karşısında.","tr-TR",2.6],[13.6,"Pofi'nin bununla hiçbir ilgisi yok.","tr-TR",3],[17.8,"Peki elmaya Almancada ne denir?","tr-TR",2.8],[20.8,"Der Apfel.","de-DE",1.8],[23.2,"Bir daha dinle.","tr-TR",1.5],[25,"Der Apfel.","de-DE",1.8],[27.2,"Yarın görüşürüz.","tr-TR",2.2]];
let start=0,fired=[];
const M=$("motes");for(let i=0;i<10;i++){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r",1.1+i%3*.5);M.appendChild(c);}
function say(txt,lang){try{if(!$("snd").checked||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
function intro(r){const on=r<INTRO;$("intro").setAttribute("opacity",on?L(r,0,.4,0,1)*L(r,2.7,3.2,1,0):0);$("tag").setAttribute("opacity",on?0:.8);if(on)$("cap").textContent="Bugün Almancada yeni bir kelime öğreniyoruz.";$("bar").setAttribute("width",360*r/(DUR+INTRO));}
function cam(t){
  let z=1,cx=200,cy=330;
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t>=a[0]&&t<b[0]){const u=(t-a[0])/(b[0]-a[0]);z=a[1]+(b[1]-a[1])*u;cx=a[2]+(b[2]-a[2])*u;cy=a[3]+(b[3]-a[3])*u;break;}}
  $("cam").setAttribute("transform","translate("+(180-z*cx)+","+(320-z*cy)+") scale("+z+")");
}
function frame(t){
  cam(t);
  // cat movement
  let x=340,y=410;
  if(t>=4&&t<8.5){x=LE(t,4,8.5,340,246);y=410+Math.sin(t*3)*1.5;}
  else if(t>=8.5&&t<16.2){x=246;}
  else if(t>=16.2&&t<17.8){const u=L(t,16.2,17.8,0,1);x=LE(t,16.2,17.8,246,192);y=410+150*(u*u*(3-2*u))-Math.sin(Math.PI*u)*40;}
  else if(t>=17.8){x=192;y=560;}
  const crouch=(t>=4&&t<9)?.9:1;
  let sq=1;if(t>=25.5)sq=LE(t,25.5,26.5,1,.9);
  $("cat").setAttribute("transform","translate("+x+","+y+") scale(1,"+(crouch*sq)+")");
  // paw
  let a=0;
  if(t>=11.2&&t<12.4)a=LE(t,11.2,12.4,0,60);else if(t>=12.4&&t<12.6)a=LE(t,12.4,12.6,60,105);else if(t>=12.6&&t<13.4)a=LE(t,12.6,13.4,105,0);
  $("arm2").setAttribute("transform","rotate("+a+" -28 -42)");
  // eyes
  const appear=L(t,2,2.8,0,1);
  const closed=(t>=22.4&&t<23.2)||(t>=25.5&&!(t>=28.5&&t<29.3))||(t>3&&t<22&&t%3.7>3.58);
  $("eyesO").setAttribute("opacity",closed?0:appear);$("pup").setAttribute("opacity",closed?0:appear);
  $("eyesC").setAttribute("opacity",closed&&t>=22?1:0);
  const px=t>=11.2&&t<13.2?L(t,11.2,11.8,0,3.2):(t<9.4?-0.5:-2);
  $("p1").setAttribute("cx",-53+px);$("p2").setAttribute("cx",-33+px);
  const bs=t>=22.5?LE(t,22.5,28,1,1.28):1;
  $("body").setAttribute("transform","translate(4,-36) scale("+bs+","+(bs*(1+Math.sin(t*2.4)*.025))+") translate(-4,36)");
  const hb=Math.sin(t*(t<9?5:1.7))*(t<9?1.5:.8);
  $("head").setAttribute("transform","translate(0,"+hb+") rotate("+(Math.sin(t*1.1)*1.5+(t>=13.4&&t<14.6?-6:0))+" -43 -50)");
  const tw=Math.max(0,Math.sin(t*2.3)-.85)*60;
  $("e1").setAttribute("transform","rotate("+(-tw)+" -52 -82)");$("e2").setAttribute("transform","rotate("+(tw*.6)+" -34 -82)");
  $("tail").setAttribute("transform","rotate("+Math.sin(t*1.6)*(t<9?4:9)+" 36 -30)");
  // apple
  let ax=190,ay=388,ar=0,rest=1;
  if(t>=12.6&&t<14){ax=LE(t,12.6,14,190,118);ar=(ax-190)*4;rest=0;}
  else if(t>=14&&t<15){ax=LE(t,14,15,118,112);ay=LE(t,14,15,388,538);ar=-290;rest=0;}
  else if(t>=15&&t<16){ax=112;ay=538-Math.abs(Math.sin((t-15)*Math.PI))*22;ar=-290;rest=0;}
  else if(t>=16){ax=114;ay=538;ar=-290;}
  $("apple").setAttribute("transform","translate("+ax+","+ay+") rotate("+ar+")");
  $("apple").style.opacity=t>=25?L(t,25,25.6,1,0):1;
  $("ash").setAttribute("cx",ax);$("ash").setAttribute("cy",ay>400?560:410);$("ash").setAttribute("opacity",rest&&t<25?.5:0);
  $("bite").setAttribute("r",t<22.2?0:L(t,22.2,22.8,0,14));
  // narrator
  let sp=0;for(const l of lines)if(t>=l[0]&&t<l[0]+l[3])sp=1;
  if(R>=.4&&R<INTRO)sp=1;
  const lean=(t>=12.6&&t<14.5)?-7:0;
  $("hd").setAttribute("transform","rotate("+(lean+(sp?Math.sin(t*6)*2:Math.sin(t*.9)*1.2)+(t>=23&&t<25.5?Math.sin(t*16)*4:0))+" 0 -150)");
  $("pony").setAttribute("transform","rotate("+(Math.sin(t*2.2)*7+lean)+" -14 -188)");
  $("torso").setAttribute("transform","translate(0,-66) scale(1,"+(1+Math.sin(t*2)*.012)+") translate(0,66)");
  $("arm0").setAttribute("transform","rotate("+(sp?Math.sin(t*4)*6:Math.sin(t*1.1)*2)+" -40 -130)");
  $("arm").setAttribute("transform","translate(22,-126) rotate("+((t>=13.2&&t<14.8)?-150:(sp?-28+Math.sin(t*3)*9:(t>=18&&t<27?-60:3+Math.sin(t*1.2)*2)))+")");
  // motes
  [...M.children].forEach((c,i)=>{c.setAttribute("cx",150+((i*37)%140)+Math.sin(t*.6+i)*6);c.setAttribute("cy",240+((i*53+t*7)%170));c.setAttribute("opacity",.35+.3*Math.sin(t+i));});
  // card, zzz, caption, bar
  $("word").setAttribute("opacity",L(t,18.2,19.2,0,1)*(t>=28?L(t,28,29,1,0):1));
  $("zzz").setAttribute("opacity",t>=26?.5+Math.sin(t*2)*.3:0);
  $("zzz").setAttribute("transform","translate(0,"+(-Math.sin(t*2)*5)+")");
  let c="";for(const k of caps)if(t>=k[0])c=k[1];
  $("cap").textContent=c;
  $("bar").setAttribute("width",360*t/DUR);
}
function loop(now){
  const r=(now-start)/1000,t=Math.max(0,r-INTRO);R=r;
  if(t>=DUR){frame(DUR-.01);intro(r);return;}
  frame(t);intro(r);if(!fired.i&&r>=.4){fired.i=1;say("Merhaba! Bugün Almancada yeni bir kelime öğreniyoruz.","tr-TR");}
  lines.forEach((l,i)=>{if(!fired[i]&&t>=l[0]){fired[i]=1;say(l[1],l[2]);}});
  requestAnimationFrame(loop);
}
function play(){try{speechSynthesis.cancel();}catch(e){}fired=[];start=performance.now();requestAnimationFrame(loop);}
$("replay").onclick=play;
window.renderAt=function(r){R=r;const t=Math.max(0,r-INTRO);frame(Math.min(t,DUR-.01));intro(r);};
if(location.search.indexOf("render")<0)play();
</script>
