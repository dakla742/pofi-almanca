<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Learn German with Pofi · die Milch</title>
<style>
html,body{margin:0;background:#111}
body{display:flex;justify-content:center;padding:10px}
#stage{position:relative;width:360px;height:640px;overflow:hidden;background:#f1dfb8;font-family:"Noto Sans","DejaVu Sans","Segoe UI",sans-serif}
#stage>*,#world>*{position:absolute}
#world{left:0;top:0;width:360px;height:640px;transform-origin:50% 75%}
img{display:block}
#title{left:0;top:14px;width:360px;text-align:center;font-weight:800;font-size:20px;color:#8f1f1f;text-shadow:0 0 6px #fff8ea}
#sub{left:0;top:40px;width:360px;text-align:center;font-size:12px;color:#8a5a0c;font-weight:700;text-shadow:0 0 6px #fff8ea}
#slogan{left:0;top:70px;width:360px;text-align:center;font-size:17px;font-weight:800;color:#8f1f1f;opacity:0;text-shadow:0 0 6px #fff8ea}
#card{left:30px;top:70px;width:300px;height:172px;background:#fff8ea;border:3px solid #d9a62e;border-radius:18px;box-shadow:0 8px 20px rgba(60,30,10,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#card svg{width:58px;height:62px}
#w{font-size:40px;font-weight:800;color:#2a1d12;line-height:1.15}
#tr{font-size:21px;font-weight:700;color:#a82a2a}
#ipa{font-size:12px;color:#7a6650}
#strip{left:30px;top:248px;width:300px;background:#fff8ea;border:2.5px solid #d9a62e;border-radius:14px;padding:6px 10px;text-align:center;opacity:0;box-shadow:0 4px 12px rgba(60,30,10,.25)}
#strip b{display:block;font-size:17px;color:#2a1d12}
#strip i{display:block;font-style:normal;font-size:12.5px;color:#a82a2a}
#say{left:40px;top:110px;width:280px;text-align:center;background:linear-gradient(135deg,#4a1f86,#8a4fd0);border:3px solid #e3cbff;border-radius:20px;padding:12px 8px;color:#fff;opacity:0;box-shadow:0 0 22px rgba(160,100,255,.65)}
#say1{font-size:32px;font-weight:800}#say2{font-size:14px;opacity:.9;height:18px}
#dots{display:flex;gap:10px;justify-content:center;margin-top:6px}
#dots span{width:14px;height:14px;border-radius:50%;background:#e3cbff;opacity:.3}
#miyav{left:230px;top:290px;background:#fff;border:2.5px solid #d9a62e;border-radius:16px;padding:5px 12px;font-weight:800;font-size:18px;color:#2a1d12;opacity:0}
#intro{left:20px;top:92px;width:320px;text-align:center;background:linear-gradient(135deg,#4a1f86,#8a4fd0);color:#fff;border:3px solid #e3cbff;border-radius:16px;padding:14px 10px;font-size:22px;font-weight:800;line-height:1.25;opacity:0;box-shadow:0 0 22px rgba(160,100,255,.65);text-shadow:0 2px 4px rgba(40,10,80,.5)}
#cap{left:12px;top:604px;width:336px;text-align:center;color:#fff;font-size:17px;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000,0 2px 5px #000}
#bar{left:0;top:0;height:4px;width:0;background:#8a4fd0}
.sp{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;opacity:0}
</style></head><body>
<div id="stage">
<div id="world">
<img id="bg" src="assets/1.jpg" style="left:0;top:-3px;width:360px;height:645px">
<img id="bE" src="assets/cut/6.png"><img id="bM" src="assets/cut/7.png">
<img id="aP" src="assets/cut/4.png"><img id="aL" src="assets/cut/5.png">
<img id="pP" src="assets/cut/3.png"><img id="pX" src="assets/cut/2.png">
</div>
<div id="title">Learn German with Pofi</div><div id="sub"></div><div id="slogan">Easy. Fun. Effective.</div>
<div id="card"><svg id="ico" viewBox="-40 -45 80 85"></svg><div id="w"></div><div id="tr"></div><div id="ipa"></div></div>
<div id="strip"><b id="ex"></b><i id="ext"></i></div>
<div id="miyav">Miyav!</div>
<div id="say"><div id="say1"></div><div id="say2"></div><div id="dots"><span></span><span></span><span></span></div></div>
<div id="intro">Her gün bir Almanca kelime öğreneceksin!</div>
<div id="cap"></div><div id="bar"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const L=(t,a,b,x,y)=>t<=a?x:t>=b?y:x+(y-x)*(t-a)/(b-a);
const E=(t,a,b,x,y)=>{const u=L(t,a,b,0,1);return x+(y-x)*u*u*(3-2*u)};
const TOTAL=26,R={bE:1.326,bM:1.325,aP:.415,aL:.411,pP:.619,pX:.714};
const ICONS={apple:`<defs><radialGradient id="ap" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#e8574d"/><stop offset="1" stop-color="#9c1c1c"/></radialGradient></defs><path d="M0 -20C-12 -34 -38 -22 -34 6C-31 28 -14 38 0 32C14 38 31 28 34 6C38 -22 12 -34 0 -20Z" fill="url(#ap)"/><path d="M0 -20q2-12 9-16" stroke="#4a3320" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="-30" rx="9" ry="4.5" fill="#4a8a3c"/>`,
milk:`<defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9eef5"/><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#d5dde8"/></linearGradient></defs><path d="M-24 -34L24 -34L17 34Q0 41 -17 34Z" fill="#dbe9f6" stroke="#9fb3c8" stroke-width="2.5"/><path d="M-22 -14L22 -14L16 32Q0 38 -16 32Z" fill="url(#mk)"/><ellipse cx="0" cy="-14" rx="22" ry="4" fill="#fff" stroke="#e1e7ef"/><ellipse cx="0" cy="-34" rx="24" ry="4" fill="none" stroke="#9fb3c8" stroke-width="2.5"/>`};
const W=window.WORD||{day:2,article:"die",word:"Milch",tr:"süt",ipa:"/diː mɪlç/ · Milch",icon:"milk",de:"Ich trinke Milch.",de_tr:"Ben süt içiyorum.",s1:"Pofi yine boş kabını tırmalıyor. Süt istiyor!",s2:"Tamam Pofi, geliyor! Sütün Almancası şöyle:",outro:"Harika! Pofi de çok memnun. Yarın yeni kelime!"};
const AC=({der:"#2f5fa8",die:"#c0392b",das:"#3d8a4a"})[W.article]||"#2f5fa8",full=W.article+" "+W.word;
$("ico").innerHTML=ICONS[W.icon]||"";
$("w").innerHTML='<b style="color:'+AC+'">'+W.article+'</b> '+W.word;
$("tr").textContent=W.tr;$("ipa").textContent=W.ipa;$("ex").textContent=W.de;$("ext").textContent=W.de_tr;
$("sub").textContent="Gün "+W.day+" · Her gün bir Almanca kelime";
const caps=[[1.4,W.s1],[5,W.s2],[8.8,full],[10.4,"Yani "+W.tr],[11.8,W.de],[13.8,W.de_tr],[15.6,"Şimdi benimle tekrar et!"],[17.4,full],[19.2,"Sen söyle!"],[22,W.outro]];
for(let i=0;i<6;i++){const d=document.createElement("div");d.className="sp";d.id="sp"+i;$("stage").appendChild(d)}
function kf(r,k){let i=0;while(i<k.length-2&&r>=k[i+1][0])i++;const a=k[i],b=k[i+1];return [1,2,3].map(j=>E(r,a[0],b[0],a[j],b[j]))}
const win=(r,a,b)=>E(r,a,a+.35,0,1)*E(r,b-.35,b,1,0);
function put(id,c,op,tf){const e=$(id),w=c[2]*R[id];e.style.width=w+"px";e.style.height=c[2]+"px";e.style.left=(c[0]-w/2)+"px";e.style.top=(c[1]-c[2])+"px";e.style.opacity=op;e.style.transformOrigin="50% 100%";e.style.transform=tf||""}
function renderAt(r){
  $("world").style.transform="scale("+(r<5?E(r,1.4,5,1.12,1):(r>=15.6?1+.04*E(r,15.6,26,0,1):1))+")";
  const sw=(r>=2&&r<5)?Math.sin(r*22)*1.6:0;
  put("pP",[190,585,300],win(r,0,5.0),"rotate("+sw+"deg)");
  const mk=E(r,6.6,7.4,0,1);
  const b=kf(r,[[0,105,592,72],[5,105,592,72],[5.8,205,572,68],[8.8,205,572,68],[9.4,190,585,60],[99,190,585,60]]);
  put("bE",b,1-mk);put("bM",b,mk);
  put("aP",kf(r,[[5,-90,596,400],[5.8,110,596,400],[8.8,110,596,400],[9.4,95,598,300],[99,95,598,300]]),win(r,5,15.9),"rotate("+Math.sin(r*1.5)*.6+"deg)");
  put("aL",[105,598,360],win(r,15.6,99),"rotate("+Math.sin(r*1.5)*.6+"deg)");
  put("pX",kf(r,[[5,270,585,220],[8.8,270,585,220],[9.4,285,590,190],[15.6,285,590,190],[16.2,275,590,200],[99,275,590,200]]),win(r,5,99),"translateY("+Math.sin(r*6)*2+"px)");
  const cp=win(r,8.8,15.6);$("card").style.opacity=cp;$("card").style.transform="scale("+(.9+.1*E(r,8.8,9.3,0,1))+")";
  const pu=(r>=8.8&&r<9.6)||(r>=17.4&&r<18.2)?1+.1*Math.sin(Math.PI*(r%8.6<1?(r-8.8)/.8:(r-17.4)/.8)):1;$("w").style.transform="scale("+(r<10?pu:1)+")";
  $("strip").style.opacity=win(r,11.8,15.6);
  $("miyav").style.opacity=win(r,1.8,4.8);$("miyav").style.transform="scale("+(1+.08*Math.sin(r*8))+")";
  const sa=win(r,16.8,21.9);$("say").style.opacity=sa;
  $("say1").textContent=r<19.2?full:"Sen söyle!";$("say2").textContent=r<19.2?"Dinle…":"";
  $("say1").style.transform="scale("+((r>=17.4&&r<18.2)?1+.08*Math.sin(Math.PI*(r-17.4)/.8):1)+")";
  [...$("dots").children].forEach((d,i)=>d.style.opacity=r>=19.4+i*.8?1:.3);
  $("slogan").style.opacity=E(r,22.4,23,0,1);
  for(let i=0;i<6;i++){const s=$("sp"+i),q=(r-6.6-i*.08)/1.1;s.style.opacity=(q>0&&q<1)?Math.sin(Math.PI*q):0;s.style.left=(195+i*7+Math.cos(i*2)*10)+"px";s.style.top=(540-q*45-i*3)+"px"}
  const io=E(r,0,.2,0,1)*E(r,1,1.3,1,0);$("intro").style.opacity=io;$("intro").style.transform="scale("+(.9+.1*io)+")";
  let c="";for(const k of caps)if(r>=k[0])c=k[1];$("cap").textContent=c;
  $("bar").style.width=360*r/TOTAL+"px";
}
window.renderAt=renderAt;renderAt(0);
if(location.search.indexOf("render")<0){const st=performance.now();(function f(n){const r=((n-st)/1000)%(TOTAL+1);renderAt(Math.min(r,TOTAL));requestAnimationFrame(f)})(st)}
</script></body></html>
